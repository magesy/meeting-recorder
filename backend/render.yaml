services:
  - type: web
    name: meeting-recorder-backend
    env: docker
    plan: free
    region: singapore # Closest to Thailand
    envVars:
      - key: OPENAI_API_KEY
        sync: false # You will set this in Render UI
      - key: GOOGLE_API_KEY
        sync: false # You will set this in Render UI
      - key: UPLOAD_DIR
        value: uploads
